name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Extensions
        run: bun run zip

      - name: Check output
        run: |
          pwd
          ls -la
          ls -la .output || true

      - name: Remove source zip
        run: rm -f .output/*sources.zip

      - name: Check output2
        run: |
          pwd
          ls -la
          ls -la .output || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boss-helper
          path: .output/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: boss-helper
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: dist/*
